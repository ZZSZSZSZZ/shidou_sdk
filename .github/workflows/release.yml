name: release

# Tag releases: validate the committed prebuilt tree on all three
# payloads (Windows x64, Linux x86_64 and aarch64) by calling ci.yml --
# configure, build examples, consumer smoke -- then attach archives of
# the tagged tree (headers + prebuilt libs + examples; no SDK source) to
# the GitHub Release of the pushed tag.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  validate:
    # ci.yml's build-and-smoke definition, reused so the tag-time check
    # cannot drift from the push-time one; the matrix legs, their runner
    # and the timeout live there.
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Archive tagged tree
        run: |
          git archive --format=tar.gz -o shidou_sdk-$GITHUB_REF_NAME.tar.gz HEAD
          git archive --format=zip -o shidou_sdk-$GITHUB_REF_NAME.zip HEAD

      - name: Create release with tree archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            shidou_sdk-$GITHUB_REF_NAME.tar.gz \
            shidou_sdk-$GITHUB_REF_NAME.zip \
            --generate-notes --repo "$GITHUB_REPOSITORY"
